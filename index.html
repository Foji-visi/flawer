<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Сад</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="sky"></canvas>
  <canvas id="garden"></canvas>

  <div class="hint" id="hint">
    <p class="hint-love">Для тебя <span class="heart">❤</span></p>
    <p class="hint-sub">веди пальцем по экрану — здесь растут цветы</p>
  </div>

  <button class="clear-btn" id="clearBtn" aria-label="Очистить сад">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <path d="M4 4L14 14M14 4L4 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>

  <script src="script.js"></script>
</body>
</html>
